<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartyAI</title>
    <!-- شاشة التحميل الاحترافية -->
    <style>
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a; /* خلفية داكنة لتتناسب مع وضعك الليلي */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        transition: opacity 0.6s ease;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #1e293b;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .splash-text {
        margin-top: 20px;
        color: #94a3b8;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .splash-logo {
        font-size: 28px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      /* إخفاء الشاشة بعد تحميل التطبيق */
      .splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- شاشة التحميل -->
    <div id="splash">
      <div class="splash-logo">SmartyAI</div>
      <div class="spinner"></div>
      <div class="splash-text">جاري تحميل المنصة...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- إخفاء شاشة التحميل بعد تحميل React -->
    <script>
      window.addEventListener('load', function() {
        const splash = document.getElementById('splash');
        if (splash) {
          // نعطي مهلة بسيطة لضمان ظهور التطبيق
          setTimeout(function() {
            splash.classList.add('splash-hidden');
            // إزالة العنصر بعد انتهاء التأثير لتحرير الذاكرة
            setTimeout(function() {
              splash.remove();
            }, 600);
          }, 400);
        }
      });
    </script>
  </body>
</html>
